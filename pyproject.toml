[build-system]
requires = ["setuptools>=77", "wheel>=0.42"]
build-backend = "setuptools.build_meta"

[project]
name = "fivefury"
version = "0.4.23"
description = "Python library for GTA V asset workflows including YMAP, YTYP, RPF, YTD and GameFileCache utilities."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Codex" },
]
license = "Unlicense"
license-files = ["LICENSE"]
dependencies = [
  "av>=18.1.0,<19",
  "miniaudio>=1.71",
  "numpy>=2.4.6,<3",
  "trimesh>=5.0.0,<6",
]

[project.optional-dependencies]
test = [
  "pytest>=9.1,<10",
  "pytest-benchmark>=5,<6",
  "Pillow>=12,<13",
  "texfury>=1.6.3,<2",
  "build>=1.3,<2",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["fivefury*"]

[tool.setuptools.package-data]
fivefury = ["data/*.dat", "drawable/*.xml", "ydr/*.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "bench_*.py"]
python_classes = ["Test*", "*Tests"]
python_functions = ["test_*"]
addopts = "--strict-markers --strict-config"
empty_parameter_set_mark = "fail_at_collect"
markers = [
  "integration(*environment_variables): external game files, reference corpus or custom mod required",
  "abi: cross-interpreter checks of the built extension",
  "performance: repeatable timing measurements, separate from functional tests",
  "requires_platform(*os_names): platform-specific implementation contract",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fivefury.vector.Quaternion",
  "fivefury.vector.Vector2",
  "fivefury.vector.Vector3",
  "fivefury.vector.Vector4",
]
